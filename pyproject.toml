[project]
name = "hipot"
version = "0.0.0"
description = "HiPot: hardware roles at clean tech startups"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyyaml>=6",
    "jsonschema[format-nongpl]>=4.23",
    "httpx>=0.27",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
