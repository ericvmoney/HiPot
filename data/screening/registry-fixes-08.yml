# Registry fixes 08: pivot sweep of listed companies, and the M3 spot check's open cases (2026-11-25).
#
# Written by workstream A2. 167 listed companies whose public reason touches chips, cooling, power conversion,
# drones or aviation, smart glass, magnets, sensors, robots, defense or data centers were checked against their
# own sites (and a news item where needed): 143 still hold. Amber Semiconductor and Boston Materials, already
# taken out by the supervisor, were not repeated.
#
#   fixes with `ruling`        tier changes under an owner decision (applied by tools/apply_screening.py)
#   fixes with kind reason-only corrected public reasons; the tier is unchanged (no ruling needed)
#   questions                  mixed cases for the owner, each with the facts on both sides
#
# Evidence quotes come from the companies' own pages unless marked otherwise. Sites that refused automated
# clients were not retried (aemetis.com, fleetrobotics.com, relyionenergy.com, businesswire.com and others).

