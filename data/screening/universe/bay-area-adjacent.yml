# Reference list for the San Francisco Bay Area (adjacent categories): companies that plausibly build physical clean-technology or
# electrification products here, drawn from the named sources below (not from companies.yml).
# Written by workstream A2. Format: tools/coverage.py. 'excluded' lists companies a source named
# that turned out not to be in the region; they are not part of the list.

region: bay-area-adjacent
built: '2026-11-25'
sources:
- id: svr-members
  name: Silicon Valley Robotics partners and members (logo wall)
  url: https://www.svrobo.org/membership/
  note: names read from logo filenames only; full member directory is private
- id: yc-robotics-bay
  name: Y Combinator directory, Robotics, San Francisco Bay Area
  url: https://www.ycombinator.com/companies/industry/robotics/san-francisco-bay-area
  note: page shows 50 of 94; the rest load dynamically and query-string pages are disallowed by robots.txt
- id: yc-hardware-bay
  name: Y Combinator directory, Hardware, San Francisco Bay Area
  url: https://www.ycombinator.com/companies/industry/hardware/san-francisco-bay-area
  note: page shows 50 of 96
- id: yc-aviation-space-bay
  name: Y Combinator directory, Aviation and Space, San Francisco Bay Area
  url: https://www.ycombinator.com/companies/industry/aviation-and-space/san-francisco-bay-area
  note: all 24 shown
- id: yc-defense
  name: Y Combinator directory, Defense (all locations; Bay Area entries taken)
  url: https://www.ycombinator.com/companies/industry/defense
  note: all 32 shown
- id: yc-drones
  name: Y Combinator directory, Drones (all locations; Bay Area entries taken)
  url: https://www.ycombinator.com/companies/industry/drones
  note: all 21 shown
- id: yc-hardtech
  name: Y Combinator directory, Hard Tech (all locations; Bay Area entries taken)
  url: https://www.ycombinator.com/companies/industry/hard-tech
  note: page shows 50 of 145
- id: yc-satellites
  name: Y Combinator directory, Satellites and Space Exploration (Bay Area entries taken)
  url: https://www.ycombinator.com/companies/industry/satellites
  note: all 23 shown; space-exploration page (20) also read
- id: bacei-space-2025
  name: Bay Area Council Economic Institute, Space in the Bay Area (May 2025 report)
  url: https://www.bayareaeconomy.org/files/pdf/SpaceInTheBayArea2025.pdf
  note: text extracted from PDF; Industry Anchors and Entrepreneurs sections
- id: a16z-ad50
  name: a16z American Dynamism 50 (2025 and 2026 lists; Bay Area entries taken)
  url: https://a16z.com/american-dynamism-50-2026/
  note: 2025 list at https://a16z.com/american-dynamism-50-2025/
- id: trr-rbr50
  name: The Robot Report RBR50 innovation award winners 2024 and 2025 (Bay Area winners taken)
  url: https://www.therobotreport.com/rbr50-2025/
  note: 2024 list at https://www.therobotreport.com/rbr50-2024/; locations mostly not stated on page, set from company
    sites and general knowledge
- id: ca-dmv-av
  name: California DMV autonomous vehicle testing and deployment permit holders (Bay Area holders taken)
  url: https://www.dmv.ca.gov/portal/vehicle-industry-services/autonomous-vehicles/autonomous-vehicle-testing-permit-holders/
  note: locations not on page; set from general knowledge
- id: nbc-bay-evtol
  name: NBC Bay Area, Flying taxis are on the horizon
  url: https://www.nbcbayarea.com/news/tech/flying-taxis-horizon-aviation-soars-new-frontier/3753948/
- id: fortune-drone-2026
  name: Fortune, Silicon Valley just might save America from growing drone threat (2026-08-21)
  url: https://www.fortune.com/2026/08/21/silicon-valley-just-might-save-america-growing-drone-threat/
  note: only Muon Space was a Bay Area hardware maker in scope
- id: yc-semis
  name: Y Combinator company directory, Semiconductors industry page
  url: https://www.ycombinator.com/companies/industry/semiconductors
  note: robots.txt bars /companies?* (query strings) for all agents; industry and profile pages without query are
    allowed. 21 listed; websites from YC profile pages.
- id: yc-hardware
  name: Y Combinator company directory, Hardware industry page
  url: https://www.ycombinator.com/companies/industry/hardware
  note: first 50 of 169 shown; the rest load by script and were not read
- id: yc-mfg-robotics
  name: Y Combinator company directory, Manufacturing and Robotics industry page
  url: https://www.ycombinator.com/companies/industry/manufacturing-and-robotics
  note: first 50 of 158 shown; robotics-only companies left to the robotics pass unless they sell to factories or
    data centers
- id: yc-industrials
  name: Y Combinator company directory, Industrials industry page
  url: https://www.ycombinator.com/companies/industry/industrials
  note: first 50 of 467 shown
- id: semieng-funding
  name: Semiconductor Engineering quarterly chip startup funding reports, Q3 2024 to Q3 2026
  url: https://semiengineering.com/startup-funding-q3-2026/
  note: nine pages (startup-funding-q3-2024, q4-2024, q1-2025, q2-2025, q3-2025, q4-2025, q1-2026, q2-2026, q3-2026);
    Bay Area city stated in article body except four rows listed only as USA whose Bay Area HQ is from general knowledge
    (noted). robots.txt bars only GPTBot and MJ12bot.
- id: ocp-members-us
  name: Open Compute Project membership directory, US members
  url: https://www.opencompute.org/membership/membership-directory/?country=US
  note: 176 members; page gives no locations, so Bay Area HQ and websites are from general knowledge
- id: wiki-bayarea-cos
  name: Wikipedia, List of companies based in the San Francisco Bay Area
  url: https://en.wikipedia.org/wiki/List_of_companies_based_in_the_San_Francisco_Bay_Area
  note: electronics and networking sections; defunct, acquired, foreign subsidiaries, software and semiconductor
    incumbents over about 5,000 people skipped; websites from general knowledge
- id: wiki-3d-printers
  name: Wikipedia, List of 3D printer manufacturers
  url: https://en.wikipedia.org/wiki/List_of_3D_printer_manufacturers
  note: US makers with Bay Area cities
- id: search-lidar
  name: Web search, Bay Area lidar makers (Wikipedia Ouster article, LiDAR Magazine, CB Insights snippets)
  url: https://en.wikipedia.com/wiki/Ouster_(company)
  note: one web search; websites from general knowledge
