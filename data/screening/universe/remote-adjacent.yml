# Reference list for remote, adjacent categories (decision 23): US companies in the categories one layer beyond clean
# tech that hire remotely, meaning 3 or more US-remote roles on their own job board.
# Written by workstream A2. Format: tools/coverage.py. Every entry is in the registry (categories from
# registry-fixes-20) or in a proposals-05 adjacent file; most are also on a regional adjacent list.

region: remote-adjacent
built: '2026-11-27'
sources:
- id: board-remote-scan-adjacent
  name: The scout's scan of each company's own job board for US-remote roles (2026-11-27)
  url: null
  note: Every Greenhouse, Lever, Ashby and Rippling board in companies.yml and in the Colorado and Bay Area adjacent proposals,
    loaded once (data/screening/tools/remote_scan.py; 310 boards, none refused). A role counts when the feed marks it remote
    or its location says remote or anywhere, and no non-US place is named. Adjacent companies (registry-fixes-20 or proposals-05
    categories) with 3 or more such roles are listed. Built from the registry's and proposals' boards, so not independent
    of them; adjacent regions not yet scouted are not covered.
