# Reference list for remote: US companies anywhere that hire engineering staff remotely, meaning 3 or more
# US-remote roles on their own board, or a remote-first or remote-friendly policy on their own careers page.
# Written by workstream A2. Format: tools/coverage.py. Many entries are also on a regional list.

region: remote
built: '2026-11-25'
sources:
- id: board-remote-scan
  name: The scout's scan of each company's own job board for US-remote roles (2026-11-25)
  url: null
  note: Every Greenhouse, Lever, Ashby and Rippling board in companies.yml and the scout's proposals, loaded once
    (data/screening/tools/remote_scan.py). A role counts when the feed marks it remote or its location says remote
    or anywhere, and no non-US place is named. Companies with 3 or more such roles are listed. Built from the registry's
    boards, so not independent of companies.yml.
- id: own-careers-remote
  name: Remote-work statements on companies' own careers pages
  url: null
  note: About 220 clean-tech hardware careers pages read for a stated remote-first or remote-friendly policy (harvest
    of 2026-11-24).
- id: awesome-sustainability-jobs
  name: awesome-sustainability-jobs (github.com/pogopaule), USA and Remote sections, 're' flag
  url: https://github.com/pogopaule/awesome-sustainability-jobs
  note: '''re'' flag means ''has at least one remote job offering'' (not a stated policy)'
- id: remotefirstjobs
  name: Remote First Jobs company directory (aggregator; sitemap_companies.xml slugs plus company pages)
  url: https://remotefirstjobs.com/companies
  note: Aggregator calls every listed company a 'remote-first company' when it has remote postings; weak evidence
- id: web-search-snippets
  name: Web search results quoting company job posts or remote-job board profiles
  url: null
  note: 10 web searches used; only kept where the company's own words or a remote-job board profile were quoted
