- id: yc-directory
  name: Y Combinator company directory, read through the yc-oss public JSON mirror of YC's directory (companies/all.json,
    6,408 launched companies, mirror updated 2026-11-24)
  url: https://yc-oss.github.io/api/companies/all.json
  note: The ycombinator.com/companies directory is rendered by JavaScript, so the mirror was used. Pool = every
    company whose industries include Climate or Energy (YC now files both under Industrials), or that carries a
    climate tag (Climate, ClimateTech, Energy, Electric Vehicles, Solar Power, Renewable Energy, Energy Storage,
    Carbon Capture and Removal, Hydrogen Energy, Fusion Energy, Alternative Fuels, Small Modular Reactors, Alternative
    Battery Tech, Smart Grid, Sustainability), plus Industrials/hardware/aviation/manufacturing/automotive companies
    whose description matches clean-tech keywords. Also swept every Bay Area company for clean-tech keywords. Filtered
    by the all_locations field for Bay Area cities. Active and Public only. Two individual ycombinator.com/companies
    pages (valo, phykos) were fetched to fill in missing websites.
