# Reference list for the San Francisco Bay Area: companies that plausibly build physical clean-technology or
# electrification products here, drawn from the named sources below (not from companies.yml).
# Written by workstream A2. Format: tools/coverage.py. 'excluded' lists companies a source named
# that turned out not to be in the region; they are not part of the list.
# Quarantined sources (robots.txt barred the pages read): builtin-energy, builtin-sf-greentech. Companies named only by them were removed.

region: bay-area
built: '2026-11-25'
