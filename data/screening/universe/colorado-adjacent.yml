# Reference list for Colorado (adjacent categories): companies that plausibly build physical clean-technology or
# electrification products here, drawn from the named sources below (not from companies.yml).
# Written by workstream A2. Format: tools/coverage.py. 'excluded' lists companies a source named
# that turned out not to be in the region; they are not part of the list.

region: colorado-adjacent
built: '2026-11-25'
sources:
- id: mdedc-aero-cluster
  name: Metro Denver EDC aerospace industry cluster page
  url: https://www.metrodenver.org/why-metro-denver/business-climate/industry-clusters/aerospace/
  note: robots.txt allows all but /wp-admin/
- id: mdedc-aero-report-2025
  name: Metro Denver EDC 2025 Aerospace Industry Report (PDF)
  url: https://www.metrodenver.org/wp-content/uploads/2026/05/Aerospace-One-Pager-2025.pdf
  note: logos and award tables
- id: mdedc-aero-scan-2026
  name: Metro Denver EDC 2026 Aerospace Industry Report / cluster scan (PDF)
  url: https://www.metrodenver.org/wp-content/uploads/2026/11/2026-Aerospace-Cluster-Scan-2.pdf
  note: mostly overlaps the cluster page
- id: mdedc-aero-study-2023
  name: Metro Denver EDC 2023 Aerospace Industry Cluster Study (PDF)
  url: https://www.metrodenver.org/wp-content/uploads/2026/06/202320Aerospace20Industry20Cluster20Study.pdf
  note: text extracted locally from the fetched PDF
- id: csc-metrodenver
  name: Colorado Space Coalition page (Metro Denver EDC; spacecolorado.org redirects here)
  url: https://www.metrodenver.org/get-involved/committees-coalitions/colorado-space-coalition/
  note: board/member organization list; most entries are firms, governments or services
- id: oedit-choosecolorado
  name: OEDIT Choose Colorado aerospace, advanced manufacturing and electronics industry pages
  url: https://choosecolorado.com/key-industries/aerospace/
  note: also /key-industries/advanced-manufacturing/ and /key-industries/electronics/; the semiconductors & quantum
    page named no companies; oedit.colorado.gov itself answered 403
- id: cama-home
  name: Colorado Advanced Manufacturing Association (CAMA) home page
  url: https://co-cama.org/
  note: member directory loader is disallowed in robots.txt, so only members named on the home page were taken
- id: mfredge-cmn-awards
  name: Manufacturer's Edge, Colorado Manufacturing Network Awards press release
  url: https://manufacturersedge.com/press-release-colorado-manufacturing-network-awards-honor-top-manufacturing-innovators-champions-and-trailblazers-across-colorado/
- id: mfredge-casestudies
  name: Manufacturer's Edge case-study posts (via post sitemap)
  url: https://manufacturersedge.com/post-sitemap.xml
  note: about 25 case studies, mostly consumer/food makers; Deltech, vForge and Valor read
- id: cu-vp-midyear
  name: CU Boulder Venture Partners FY2026 mid-year update (startups launched)
  url: https://www.colorado.edu/venturepartners/about/reports/venture-partners-mid-year-update
  note: 29 startups listed, most biotech/software
- id: cu-vp-annual
  name: CU Boulder Venture Partners annual report
  url: https://www.colorado.edu/venturepartners/about/reports/current-annual-report
  note: startup-portfolio page loads dynamically and returned no names
- id: cu-jila-spinoffs
  name: CU Boulder Today, JILA spinoff companies (2012)
  url: https://www.colorado.edu/today/2012/04/09/jila-spinoff-companies
  note: dated 2012; some firms since acquired or renamed
- id: cubit-partners
  name: CU Boulder CUbit Quantum Initiative industry partners
  url: https://www.colorado.edu/initiative/cubit/industry-partners
  note: out-of-state partners skipped
- id: cubit-seed-2026
  name: CUbit / OEDIT quantum translational seed grants, third round (2026)
  url: https://www.colorado.edu/initiative/cubit/2026/04/29/colorado-advances-quantum-innovation-third-round-translational-seed-grant-awards
- id: mines-search
  name: Web search results limited to mines.edu (Mines-affiliated startups)
  url: null
  note: names from search-result text of mines.edu pages, not a fetched list; ventures.mines.edu/startups names
    no companies
- id: cos-chamber-aero
  name: Colorado Springs Chamber & EDC aerospace/defense pages
  url: https://coloradospringschamberedc.com/aerospace-defense-companies-colorado-springs/
  note: also /defense-military/defense-development/ (logo list)
- id: inven-robotics-co
  name: Inven, Top 23 Robotics Companies in Colorado
  url: https://www.inven.ai/company-lists/top-23-robotics-companies-in-colorado
  note: distributors and services firms skipped
- id: beststartup-robotics-co
  name: BestStartup.us, 101 Best Colorado Robotics Companies and Startups (Oct 2022)
  url: https://beststartup.us/101-best-colorado-robotics-companies-and-startups/
  note: 2022 list with no cities; many software/services entries skipped; several kept entries unverified
- id: tid-semis-co
  name: 'Trade & Industry Development, Semiconductor State of Mind: Colorado'
  url: https://www.tradeandindustrydev.com/region/colorado/semiconductor-state-mind-colorado-lead-chips-race-32624
  note: robots.txt allows Claude-User; large chip firms with only design centers skipped
- id: cu-semis-forum
  name: CU Boulder Colorado Semiconductor Workforce and Innovation Forum page
  url: https://www.colorado.edu/researchinnovation/colorado-semiconductor-workforce-and-innovation-forum
- id: ucd-aero-list
  name: CU Denver Business School, Aerospace associations, organizations and company information (PDF)
  url: https://business.ucdenver.edu/content/aerospace
  note: 2021 PDF
- id: ucd-mfg-list
  name: CU Denver Business School, Manufacturing associations, organizations and company information (PDF)
  url: https://business.ucdenver.edu/content/manufacturing-companies
  note: mostly consumer and food makers
- id: sens-site
  name: Stored Energy Systems company site (found by a data-center equipment web search)
  url: https://www.sens-usa.com/
  note: the news article the search pointed to (citybiz.co) answered 403
- id: cma-members
  name: Colorado Mining Association, Current CMA Members (logo wall)
  url: https://www.coloradomining.org/membership
  note: Logo wall only, no member links; names read from logo alt text and file names, several misspelled or unreadable
    (numeric file names). robots.txt allows the page.
- id: cgs-is88
  name: 'Colorado Geological Survey (at Colorado School of Mines), Information Series 88: Colorado Mineral and Energy
    Industry Activities 2024-2025'
  url: https://coloradogeologicalsurvey.org/wp-content/uploads/2026/03/IS-88.pdf
  note: Active coal mines table, metal mines, exploration project list and industrial minerals sections. Added as
    the Mines-hosted state survey source because Mines publishes no spinout list. robots.txt allows all.
- id: e360-methane
  name: Yale Environment 360, Methane Detectives feature
  url: https://e360.yale.edu/features/methane-detectives-can-a-wave-of-new-technology-slash-natural-gas-leaks
  note: Front Range methane-detection companies; Ball Aerospace also named but is aerospace, outside this pass.
- id: cu-venture-partners
  name: CU Boulder Venture Partners startup portfolio (LongPath profile)
  url: https://www.colorado.edu/venturepartners/startup-portfolio/longpath-technologies-inc
