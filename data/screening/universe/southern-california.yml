  note: Aggregator calls every listed company a 'remote-first company' when it has remote postings; weak evidence
- id: shell-gamechanger
  name: Shell GameChanger start-ups (graduates since 2021 and current projects)
  url: https://www.shell.com/what-we-do/technology-and-innovation/innovate-with-shell/shell-gamechanger/portfolio.html
  note: ~110 names, client-rendered (read in a browser after rejecting optional cookies). No HQ shown; many non-US.
- id: slc
  name: Spring Lane Capital investments
  url: https://www.springlanecapital.com/investments
  note: 13 companies listed by name only.
- id: third-derivative
  name: Third Derivative (RMI) startup portfolio
  url: https://www.third-derivative.org/portfolio
  note: 322 profile pages (read earlier today, cached in scratchpad); HQ field on each profile; 161 non-US skipped.
- id: voyager
  name: Voyager Ventures portfolio
  url: https://www.voyagervc.com/portfolio
  note: 41 companies over 5 pages.
- id: web-search-snippets
  name: Web search results quoting company job posts or remote-job board profiles
  url: null
  note: 10 web searches used; only kept where the company's own words or a remote-job board profile were quoted
- id: yc
  name: Y Combinator company directory (yc-oss public JSON mirror)
  url: https://yc-oss.github.io/api/companies/all.json
  note: Mirror of YC's directory (6,408 companies). Filtered to active/public US companies in industrials, energy,
    climate, aviation, automotive or manufacturing, or with matching tags (913), then read by hand.
