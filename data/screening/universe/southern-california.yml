# Reference list for Southern California: companies that plausibly build physical clean-technology or
# electrification products here, drawn from the named sources below (not from companies.yml).
# Written by workstream A2. Format: tools/coverage.py. 'excluded' lists companies a source named
# that turned out not to be in the region; they are not part of the list.

region: southern-california
built: '2026-11-25'
sources:
- id: calseed-awardees
  name: CalSEED awardee directory (all cohorts)
  url: https://calseed.fund/awardees/
  note: 25 listing pages, 147 awardee pages read; awardee pages give no location, so region was taken from the company's
    own site, another source in this file, or general knowledge (said in note)
- id: laci-portfolio
  name: LACI (Los Angeles Cleantech Incubator) portfolio, all programmes incl. alumni
  url: https://laincubator.org/portfolio/
  note: 140 entries, read from the JSON feed the portfolio page itself loads (/wp-json/endpoints/startups/); LACI
    is LA-based but serves some out-of-region startups, so known out-of-region ones were dropped
- id: builtinla-greentech
  name: Built In LA greentech companies
  url: https://www.builtinla.com/companies/type/greentech-companies
  note: page 1 only (20 companies); robots.txt disallows ?page= pagination
- id: builtinla-energy
  name: Built In LA energy companies
  url: https://www.builtinla.com/companies/type/energy-companies
  note: page 1 only (20 companies); robots.txt disallows ?page= pagination
- id: pola-zet
  name: Port of Los Angeles zero-emissions technology demonstration projects (project fact sheets)
  url: https://www.portoflosangeles.org/environment/air-quality/zero-emissions-technologies
  note: Green Omni, Everport, AID and SEA-CHANGE fact sheets read; most partners are terminals, agencies or out-of-region
    OEMs
- id: uci-startups
  name: UCI Beall Applied Innovation startups
  url: https://innovation.uci.edu/startups/
  note: 128 entries via the site's WordPress listing; mostly biotech/software
- id: caltech-local-startups
  name: Caltech local startups (energy section) and Caltech venture mentions
  url: https://local.caltech.edu/economic-impact/local-startups
  note: Captura, Contour Energy Systems and Powerflex named as Caltech ventures in Caltech pages seen via search
    results
- id: ucsd-battery-startups
  name: 'UC San Diego Today: researchers at the forefront of the EV battery revolution (+ UCSD story on Ateios)'
  url: https://today.ucsd.edu/story/uc-san-diego-researchers-at-the-forefront-of-the-ev-battery-revolution
  note: no UCSD startup directory found (innovation.ucsd.edu startup paths 404)
- id: ucr-otp-portfolio
  name: UC Riverside Office of Technology Partnerships company portfolio
  url: https://techpartnerships.ucr.edu/company-portfolio
  note: 133 entries (spinouts plus incubator/OASIS companies, many Inland Empire)
- id: cec-epic-nopa
  name: CEC EPIC Notice of Proposed Awards results tables
  url: https://www.energy.ca.gov/funding-opportunities/awards
  note: GFO-22-301 rounds 1-3, GFO-24-305, 24-310, 24-312, 25-301, 25-306, 25-307; tables give no location, so region
    is from general knowledge or company site
- id: echai-sd-cleantech
  name: 'eChai: cleantech and energy startups in San Diego'
  url: https://echai.ventures/sandiego/cleantech
  note: substitute for the blocked San Diego directories; names from the page's structured data
- id: hvip-catalog
  name: California HVIP eligible vehicle catalog (current and archived), CSV export
  url: https://californiahvip.org/vehicles/
  note: 204 current + 146 archived models; 52 + ~40 OEMs read; OEM field has no location, so region is from the
    CEC ZEV manufacturer table, the company site or general knowledge (said in note). BYD Motors and Evolectric
    already in pass A, not repeated.
- id: core-catalog
  name: California CORE eligible off-road equipment catalog, CSV export
  url: https://californiacore.org/equipment/
  note: 347 models, 65 manufacturers; no locations in the catalog (equipment pages have none either). Maxwell Vehicles
    and Smartville already in pass A. robots.txt asks Crawl-delay 10; respected.
- id: cec-zev-mfg-table
  name: CEC Table of ZEV and ZEV-Related Manufacturers in California (March 2026)
  url: https://www.energy.ca.gov/sites/default/files/2026-04/Table_of_ZEV_Related_Manufacturers_MAR2026_ada.pdf
  note: Linked from the CEC Clean Transportation Program ZEV-related manufacturing page; gives city and zip per
    company. Beam Global and South 8 already in pass A. PDF columns are jumbled; city matched by zip.
- id: cec-gfo-21-605
  name: CEC Clean Transportation Program GFO-21-605 Zero-Emission Transportation Manufacturing, Second Revised NOPA
    (2023-03-15)
  url: https://www.energy.ca.gov/sites/default/files/2023-03/GFO-21-605_Second_Revised_NOPA_ada.docx
  note: Awardees plus did-not-pass/disqualified applicants; no locations in the table. Evolectric already in pass
    A. Out-of-region or unknown-location applicants dropped.
- id: powerforward-nopa
  name: PowerForward ZEV Battery Manufacturing grant (CEC-funded, run by CALSTART), Notice of Proposed Awards 2025-08-13
  url: https://powerforwardgrant.org/documents/PowerForward_Updated_NOPA%202.pdf
  note: Awardees and did-not-pass applicants; Voltu Motor already in pass A. Table text is jumbled, so project-to-applicant
    pairing is approximate.
- id: sdedc-cleantech
  name: 'San Diego Regional EDC: cleantech key companies page and EDC results/blog posts'
  url: https://www.sandiegobusiness.org/about-the-region/cleantech/
  note: 16 key companies (utilities, consultants, software and a water district dropped; Nuvve and Wildcat already
    in pass A); plus EDC post on American Lithium Energy. Also the EDC manufacturing key-companies page (Flux Power).
- id: sbcounty-ev
  name: San Bernardino County news (ZM Trucks Fontana plant) and Site Selection article on San Bernardino County's
    EV sector
  url: https://siteselection.com/how-the-ev-sector-in-san-bernardino-county-is-transforming-the-way-we-move/
  note: 'Substitute for an Inland Empire Economic Partnership list (ieep.com has employment reports only, no company
    list). County page: https://main.sbcounty.gov/?p=144783'
- id: calstart-member-logos
  name: CALSTART (now Catalyst Mobility) home page member logos
  url: https://calstart.org/
  note: No public member directory exists (membership page names no members; /member-directory/ 404). Only the ~15
    member logos on the home page were readable; those with a SoCal HQ or plant taken.
- id: carb-zev-oem-map
  name: CARB map of zero-emission vehicle manufacturing and technologies for medium and heavy-duty vehicles in California
    (2021-06-03)
  url: https://ww2.arb.ca.gov/sites/default/files/2021-08/MapofZeroEmissionOEMs.pdf
  note: gives CA facility city per maker; Transpower (Poway) already in pass A; NorCal makers dropped
- id: laedc-ev-report
  name: LAEDC Electric Vehicle Report 2020 (company maps by segment)
  url: https://h2fcp.org/sites/default/files/LAEDC-EV_Report_FINAL-a.pdf
  note: laedc.org copy 404s; read the copy hosted by the California Fuel Cell Partnership. Maps list ~120 companies
    statewide without locations; SoCal ones kept by general knowledge; defunct firms (Fisker, Canoo, Balqon, Zero
    Truck, Chanje) and installers/software dropped; EV Safe Charge and Transpower already in pass A
- id: activate
  name: 'Activate companies index (all communities: Berkeley, Boston, Houston, New York, Anywhere)'
  url: https://activate-companies-index.softr.app/
  note: 263 companies read from the page's own records request; Singapore community and life-science, computing
    and agriculture companies skipped. No HQ field; community city used as inferred HQ where nothing better was
    found.
- id: arpa-e
  name: ARPA-E project awardees (private companies)
  url: https://arpa-e.energy.gov/jsonapi/custom/index/project
  note: All 1,762 projects (36 pages of 50); 488 distinct private-company awardees plus 74 untyped organizations
    reviewed. HQ is the project location ARPA-E gives unless noted.
- id: azolla
  name: Azolla Ventures portfolio (incl. Prime Impact Fund)
  url: https://azollaventures.com/our-portfolio/
  note: 36 companies.
- id: bev
  name: Breakthrough Energy Ventures portfolio
  url: https://www.breakthroughenergy.org/our-work/breakthrough-energy-ventures/bev-portfolio/
  note: Read from the data embedded in the page (103 unique companies).
- id: builtin-fully-remote
  name: Built In, 'Fully Remote' renewable-energy, greentech and energy company pages (page 1 of each; robots.txt
    disallows ?page=)
  url: https://builtin.com/companies/location/fully-remote/type/renewable-energy-companies
  note: Built In company profiles say 'Remote Workspace. Employees work remotely.'; also read /type/greentech-companies
    and /type/energy-companies page 1
- id: congruent
  name: Congruent Ventures portfolio
  url: https://www.congruentvc.com/portfolio
  note: 62 companies listed.
- id: cyclotron-road
  name: Cyclotron Road (Berkeley Lab) fellows by year, 2015-2026
  url: https://cyclotronroad.lbl.gov/fellows/fellows-by-year/
  note: ~100 companies; almost all overlap the Activate Berkeley community; Cuberg (closed) and Mosaic Materials
    (acquired) skipped.
- id: dcvc
  name: DCVC companies (energy-climate and industrial-transformation sectors)
  url: https://www.dcvc.com/companies
  note: 60 of 301 companies are tagged energy-climate or industrial-transformation; only those were reviewed.
- id: doe-oced
  name: DOE Office of Clean Energy Demonstrations award posts
  url: https://www.energy.gov/cmei/oced/listings/oced-news
  note: Award Wednesday posts and other OCED news (59 articles). Most awards went to utilities, co-ops, tribes and
    large incumbents, which were skipped. The OCED selections pages now return 404.
- id: elemental
  name: Elemental Impact portfolio
  url: https://elementalimpact.com/portfolio/
  note: 141 companies with HQ city (113 US).
- id: fifthwall
  name: Fifth Wall portfolio
  url: https://www.fifthwall.com/portfolio
  note: No separate climate list on the site; reviewed the full portfolio (4 pages, about 54 companies).
- id: greentown
  name: Greentown Labs member companies (current and alumni)
  url: https://greentown.org/members
  note: 744 members (245 current, 499 alumni) read from data embedded in the page; no HQ field (only Greentown Boston/Houston
    campus). Member pages gave websites for the first ~30, then returned a Cloudflare bot challenge; not worked
    around.
- id: halliburton-labs
  name: Halliburton Labs portfolio
  url: https://halliburtonlabs.com/companies
  note: 49 companies with HQ city.
- id: khosla
  name: Khosla Ventures sustainability companies
  url: https://www.khoslaventures.com/category/sustainability
  note: 14 companies in the sustainability category.
- id: laci
  name: LACI (Los Angeles Cleantech Incubator) portfolio
  url: https://laincubator.org/portfolio/
  note: 140 startups from the page's own JSON endpoint (/wp-json/endpoints/startups/); no HQ field.
- id: lc
  name: Lowercarbon Capital companies
  url: https://lowercarbon.com/companies/
  note: 102 companies; HQ read from the site's own company records (wp-json).
- id: prelude
  name: Prelude Ventures portfolio
  url: https://www.preludeventures.com/portfolio
  note: 61 companies including exits.
- id: remotefirstjobs
  name: Remote First Jobs company directory (aggregator; sitemap_companies.xml slugs plus company pages)
