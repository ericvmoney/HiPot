# Registry fixes 26: the Automotive category (decision 26, 2026-11-27) for companies already in the registry.
#
# Written by workstream A2 at the supervisor's request. Each entry is `kind: categories` with the company's full list
# (its existing categories kept, automotive added) and a one-line reason. Clean tech is never written: it follows from
# a core or enabling tier, which these entries leave unchanged. `tier` is shown for reading only.
#
# taxonomy.yml: automotive covers "Vehicle makers and their plants, and auto-parts suppliers, whatever the drivetrain."
# Tagged here: road-vehicle makers (cars, trucks, buses, vans and low-speed vehicles) and their plants, electric-vehicle
# makers already in clean tech, powertrain and conversion-kit makers for road vehicles, and parts suppliers whose
# main market is road vehicles. Left untagged on purpose: battery cells, packs and battery materials, chargers,
# two- and three-wheelers other than Aptera's car, e-bikes and scooters, lift trucks, rail, aircraft, autonomy
# software and robotaxi operators, and sensor makers that sell to many markets.
# Judged from each company's registry reason and notes; no new fetches.
# Entries: 70; out-tier companies listed for the first time: 22.
# Counts per category: automotive 70, autonomy-robotics 4, defense 1, oil-gas 1, semis-electronics 4.

