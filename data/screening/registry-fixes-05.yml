# Registry fixes 05: re-tiers under owner decision 13 (2026-11-24, PLAN.md section 9).
#
# Written by workstream A2. Each entry names the ruling, so tools/apply_screening.py may change the tier.
#   - In: recycled and bio-based materials (sector 'recycling'), water treatment and measurement ('water').
#   - Out: data-center equipment, cooling and computing; energy-sector companies that sell to data
#     centers stay in.
#   - New sectors also given to methane-monitoring companies ('methane'; their tier question is still open)
#     and to biofuel and e-fuel makers ('biofuels'). Entries marked "Sector only" keep their tier.
# 'was' is the registry's value before this file. 'flags' at the end lists companies the scout thinks sit
# near the data-center line but leaves unchanged.
#
# One company proposed out on the materials ground stays out: Unspun makes apparel on its own weaving
# machines, which is neither a recycled nor a bio-based material.

