# Sites that blocked workstream A2's helpers, one entry per host. Every helper brief carries the whole list, whatever
# the region (supervisor, 2026-11-28): a host here is never fetched again, and search snippets of it are not used.
# A permission refusal is final by any route (CLAUDE.md); the other kinds are the site's own block on our client.
#
# what: permission-refusal (this session's own permission check), 401, 403, 429, bot-check, robots (robots.txt bars
#       Claude-User, anthropic-ai or all agents), or refused (the site refused us; the exact response was not recorded).
# region: the pass in which it happened ("several" when it recurred; "not recorded" when the log no longer says).
# Technical failures (timeouts, certificate errors, DNS) are not blocks and are not listed.

