# Proposals 01: new companies for the registry, from workstream A2 (company scout).
#
# Written 2026-11-24. Same shape as companies.yml (schema/companies-file.schema.json).
# Every entry is a PROPOSAL: climate.basis is 'agent' and climate.approved is false.
# The supervisor applies approved entries to companies.yml; nothing here is listed.
#
# How an entry was made
#   - The company was found on a climate investor's or accelerator's public
#     portfolio page, or a published list of climate companies.
#   - Its public job board was loaded once (data/screening/tools/probe_boards.py).
#     'notes' records the board, its open roles and how the token was found.
#     Tokens matched by name were checked against the board page's own title.
#   - Facts come from the company's own site, filings, trade press and named
#     aggregators. An aggregator headcount without a date carries the day it was
#     read as as_of; notes say so. A band such as "under 100" is not a count, so
#     headcount is null and the startup reason quotes the band.
#   - Startup status: 'out' at 1,000 people or more; 'review' when no headcount
#     at all was found or the company was founded in 2015 or earlier; else 'in'.
#   - A key in brackets in notes points to a question in decisions-needed.md.
#
# Companies considered and not proposed are in rejected-01.yml.

