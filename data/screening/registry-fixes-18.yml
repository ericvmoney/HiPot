#
# Written by workstream A2 at the supervisor's request. These listed companies had no website in the registry, so
# the careers probe never looked at them. For each: its own website, its careers page and board (read only from
# its own pages), and whether it still operates. Generic client name; no sign-in, bot check or CAPTCHA; robots.txt
# obeyed; a usage limit means the rest were recorded as unknown.
#
#   kind: website     current website (tools/apply_screening.py new_website); `now: null` keeps a note instead
#   failure           what was found: active, renamed, acquired, closed or unknown
#   ats + source      the board from the company's own careers link (replace_board); type other means the careers
