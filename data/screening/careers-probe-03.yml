probe: careers-probe-03
made_by: A1 collector, python -m pipeline.collect.probe_careers
started_at: '2026-11-25T20:33:02Z'
rules: robots.txt obeyed for '*'; at most 4 page requests and 6 requests with redirects per company; 3 s between
  requests to a host; GET only; no JavaScript, no forms; stop on 403, 429, sign-in or bot check
passes: 'Live pass 2026-11-25 over 573 core or enabling companies with ats.type unknown and a website that no earlier
  probe covered, robots.txt obeyed. Re-classified offline after one fix: a link counts as a posting only when its
  address or label names a job title or ends in a posting id (careers section pages were counted before). 19 sites
  answered with a bot challenge (HTTP 202) and 32 redirect to another domain. Follow-up the same day: the 4 sites
  whose robots.txt disallows their pages, read with the owner''s approval (15 requests).'
outcomes:
  ok: postings found on the careers page (JobPosting blocks, or links to posting pages on the site)
  ats-found: the site links to a job-board system; see ats
  none-open: a careers page was read and says there are no openings
  unclear: a careers page was read but shows neither postings nor a no-openings notice
  unreadable: the careers page builds its list with JavaScript, or gives postings only as PDFs
  no-careers-page: no careers page was found on the site
  robots-disallowed: robots.txt disallows the page the probe needed
  blocked: the site refused the probe (403 or 429, a sign-in page or a bot check)
  error: the site could not be reached
