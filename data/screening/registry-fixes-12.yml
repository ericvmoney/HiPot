# Registry fixes 12: the 13 new-region companies the 1,404-company full run could not read (A1 collector).
#
# Written by workstream A1 at the supervisor's request, 2026-11-25. Each board was read from the company's
# own careers page (robots.txt obeyed, at most four pages a company) and confirmed with one Workday search
# (`total`) or one feed request, with a generic client name. No sign-in, bot check or CAPTCHA was involved.
#
#   entries with `ats` and `source`   replace the registry's board (tools/apply_screening.py replace_board)
#   kind: parent-board                the only board found belongs to a parent company; NOT routed, per the
#                                     supervisor; the note says whether it can be narrowed and to how many
#   kind: unknown                     no board found; the reason is given
#
# `python -m pipeline.collect --check-boards` now lists any board not in the form its reader needs.

