# Registry fixes 03: facts for the agreed startup test, for companies already in companies.yml.
#
# Written 2026-11-24 by workstream A2. Covers every registry company founded in 2011 or earlier, with
# 1,000 to 5,000 people, or recorded as a subsidiary (53 companies), plus one hq fact found
# while scouting Colorado (sperra).
#
# The test (owner, 2026-11-24): independent of any company at or over 4,000 people; under 4,000
# people (about 25 percent tolerance, so up to 5,000; included when no figure exists); and at least one
# growth sign: founded within 15 years (2011 or later), an equity raise within 5 years (since
# 2021-11-24), or public for under 5 years (listed 2022 or later).
#
# Fields: parent (null when independent), last_raise (latest equity round), ipo_year, and headcount
# only where a newer dated figure was found. 'preview' is the scout's reading of the test, for the
# supervisor to check: 'was' is the current registry status. 13 statuses would change,
# 5 of them for core or enabling companies:
#   atoms out->in, crusoe review->in, formlabs review->in, invenergy out->in, lightbridge in->out, nexamp in->out, nuro review->in, skydio review->in, solv-energy out->in, motional review->out, piaggio-fast-forward in->out, rai-institute in->out, wing in->out
#
# A share sale by a company that was already public (at-the-market, registered direct, follow-on)
# is not counted as venture or growth equity; Lightbridge and ChargePoint turn on that reading.
#
# Investment-firm owners (private equity, infrastructure funds) are read as independent, since the
# firm itself is small; the companies affected say so in their reason. That reading is the scout's,
# not yet the owner's.

