# Groups
#   review      core or enabling in companies.yml, startup status 'review' (11)
#   zipline     the drone-delivery question (1)
#   unscreened  tier 'unscreened' in companies.yml, not large incumbents (13)
#   listed      the 19 companies that pass the listing rule today: lighter check
#   incumbent   large companies already marked startup 'out': tier filled in only
#
# Per entry
#   current     what companies.yml says now
#   proposed    tier, sectors, startup status and one-line reasons (rubric PLAN.md
