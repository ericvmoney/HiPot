# Registry fixes 13: websites that careers probe 03 found stale, and careers pages for five sizeable companies
# (2026-11-25).
#
# Written by workstream A2 at the supervisor's request. Each redirect comes from careers-probe-03; each new
# address was then read once (status and page title) with a generic client. No sign-in, bot check or CAPTCHA.
#
#   kind: website        current official website (tools/apply_screening.py new_website); `now: null` keeps the old
#                        address and adds a note. `failure` says what the redirect meant: same-site (http or www bounce
#                        the probe counted as leaving), moved, renamed, merged, acquired or parent.
#   careers entries      careers pages for five sizeable companies; entries with `ats` and `source` replace the
#                        registry's board (replace_board). Voluna's board was an investor's careers page and is cleared.
#   questions            Voluna (mining-exploration hardware) under A6b, for the owner.
#
# Acquisitions found here (Aclara, Arcadium, Atonometrics, Boviet, Cruz Foam, Igneo, SOLARCYCLE, UnitedSiC) may also
# change the startup label; this file only fixes websites.

