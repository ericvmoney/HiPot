# HiPot taxonomy, version 1.
#
# Every id used in jobs, companies and personas must appear here. The JSON
# schemas only check that an id is a well-formed slug; `tools/validate.py`
# checks membership against this file.
#
# Owned by the supervisor. Workstream A3 proposes changes; nobody else edits it.

taxonomy_version: 1

# Every role has exactly one function: the kind of work, whatever the field.
# `listed: false` keeps a function's roles in jobs.json but off the public
# board; flipping it needs no re-tagging. Engineering and science roles carry
# one to three disciplines; technician and trades roles carry one where the
# title names a field ("electrical technician"); other functions may carry one.
# Added in version 1 (2026-11-24) to cover the range of roles at hardware
# companies, not only engineers.
functions:
  - id: engineering
    label: Engineering
    listed: true
    covers: Engineers who design, develop, test, integrate, build or support the product, including software, data and manufacturing engineers.
  - id: science
    label: Science and research
    listed: true
    covers: Scientists and researchers in physics, chemistry, materials, electrochemistry and plasma work tied to the product.
  - id: technician
    label: Technicians
    listed: true
    covers: Lab, test, assembly, maintenance, calibration and field service technicians.
  - id: trades
    label: Skilled trades
    listed: true
    covers: Electricians, installers, welders, machinists, line workers and other licensed or skilled trades.
  - id: production
    label: Production and plant operations
    listed: true
    covers: Production associates and operators, shift and line supervisors, plant, facilities and production managers.
  - id: supply-chain
    label: Supply chain
    listed: true
    covers: Procurement, sourcing and commodity management, buyers, supplier development, planning, logistics, warehouse and materials.
    watch: A supplier quality engineer is engineering with the quality discipline; a buyer or commodity manager is supply chain.
  - id: quality-compliance
    label: Quality, certification and compliance
    listed: true
    covers: Quality inspectors and auditors, quality management, certification, regulatory and product compliance specialists.
    watch: Quality engineers are engineering with the quality discipline.
  - id: ehs
    label: Environment, health and safety
    listed: true
    covers: Workplace and site safety, environmental compliance, industrial hygiene.
  - id: project-program
    label: Projects and programs
    listed: true
    covers: Program, project, construction and deployment managers; project controls and scheduling.
  - id: field-operations
    label: Field and asset operations
    listed: true
    covers: Operations and maintenance management for deployed assets, site and fleet operations, service and deployment operations management.
    watch: Field service technicians are technicians; commissioning and field engineers are engineering with the field discipline.
  - id: product
    label: Product and design
    listed: true
    covers: Product management for a physical product, industrial and product design, user research for hardware.
  - id: sales-bd
    label: Sales and business development
    listed: false
    covers: Sales, business development, origination, account management, customer success. Sales and applications engineers are engineering with the field discipline.
  - id: marketing
    label: Marketing and communications
    listed: false
    covers: Marketing, brand, communications, content, community and policy advocacy.
  - id: finance-legal
    label: Finance, legal and strategy
    listed: false
    covers: Finance, accounting, legal, strategy, corporate development, investor relations, land and permitting.
  - id: people-admin
    label: People and administration
    listed: false
    covers: Human resources, recruiting, office and executive administration.
  - id: it
    label: IT and security
    listed: false
    covers: Corporate IT, help desk, enterprise systems and corporate security.
    watch: Product software, data and cybersecurity of the product are engineering.

disciplines:
  - id: systems
    label: Systems
    covers: Requirements, architecture, interfaces, integration, safety cases, verification planning.
  - id: electrical
    label: Electrical
    covers: Board design, harness, high and low voltage distribution, electrical integration.
  - id: power-electronics
    label: Power electronics
    covers: Converters, inverters, chargers, magnetics, gate drives.
  - id: battery
    label: Battery and cell
    covers: Cell, module and pack engineering, battery management, electrochemistry applied to product.
  - id: power-systems
    label: Power systems and grid
    covers: Interconnection, protection, studies, substation and plant electrical design.
    watch: The title "power systems engineer" also means utility studies at non-hardware firms.
  - id: mechanical
    label: Mechanical
    covers: Mechanical design, structures, mechanisms, enclosures, packaging.
  - id: thermal
    label: Thermal and fluids
    covers: Thermal management, heat transfer, fluid systems, HVAC and refrigeration cycles.
  - id: controls
    label: Controls
    covers: Control algorithms, modelling and simulation, plant controls for the company's own product.
    watch: The title "controls engineer" also means PLC work for factory automation, which belongs in manufacturing.
  - id: firmware
    label: Firmware and embedded
    covers: Embedded software, firmware, real-time systems, device drivers, bootloaders.
    watch: The title "firmware engineer" also appears at storage-silicon and consumer-device firms.
  - id: software
    label: Software
    covers: Software engineering at a hardware company - device, fleet, controls, energy management, SCADA, tools, test automation, platform and web.
  - id: data
    label: Data and machine learning
    covers: Data engineering, analytics, data science and machine learning on product, fleet, process or grid data.
  - id: test
    label: Test and validation
    covers: Design verification, hardware-in-the-loop, reliability, test equipment and fixtures.
  - id: manufacturing
    label: Manufacturing and process
    covers: Manufacturing, process and industrial engineering, new product introduction, factory automation.
  - id: chemical-process
    label: Chemical and process
    covers: Process design and scale-up for electrolyzers, fuels, carbon removal, materials refining.
  - id: materials
    label: Materials and R&D
    covers: Materials science, electrochemistry and physics research roles tied to a hardware product.
  - id: nuclear-plasma
    label: Nuclear and plasma
    covers: Fission and fusion engineering, plasma physics, neutronics, radiation and shielding.
  - id: optics
    label: Optics, lasers and photonics
    covers: Optical design, laser systems, photonics and optical metrology.
  - id: civil-structural
    label: Civil and structural
    covers: Civil, structural and geotechnical engineering for sites, foundations, plants and installations.
  - id: aerospace
    label: Aerospace and flight
    covers: Aircraft structures, aerodynamics, flight controls, flight test and airworthiness for electric aircraft.
  - id: quality
    label: Quality, safety and compliance
    covers: Quality, product safety, certification, regulatory compliance.
  - id: field
    label: Field and applications
    covers: Commissioning, field engineering, applications and sales engineering, customer deployment.
# Version 1 moved "product" and "program" out of disciplines: they are now the
# functions `product` and `project-program`.

levels:
  - {id: intern, label: Intern or co-op}
  - {id: entry, label: Entry}
  - {id: mid, label: Mid}
  - {id: senior, label: Senior}
  - {id: staff, label: Staff or lead}
  - {id: principal, label: Principal or architect}
  - {id: manager, label: Manager}
  - {id: director, label: Director or head}
  - {id: executive, label: VP and above}
# A job's level is null when the title does not state one.

sectors:
  - {id: energy-storage, label: Energy storage}
  - {id: solar, label: Solar}
  - {id: wind, label: Wind}
  - {id: grid, label: Grid and transmission}
  - {id: distributed-generation, label: Distributed generation and microgrids}
  - {id: geothermal, label: Geothermal}
  - {id: fusion, label: Fusion}
  - {id: fission, label: Fission}
  - {id: hydrogen, label: Hydrogen and clean fuels}
  - {id: ev, label: Electric vehicles}
  - {id: charging, label: Charging}
  - {id: electric-aviation, label: Electric aviation (civil)}
  - {id: electric-mobility, label: "Other electric mobility (micromobility, marine, rail, off-road)"}
  - {id: buildings, label: Buildings and home electrification}
  - {id: industrial-heat, label: Industrial heat and process}
  - {id: carbon-removal, label: Carbon removal and capture}
  - {id: battery-materials, label: Battery materials and recycling}
  - {id: components, label: "Enabling components (motors, power semiconductors, cables)"}

stages:
  - {id: pre-seed, label: Pre-seed}
  - {id: seed, label: Seed}
  - {id: series-a, label: Series A}
  - {id: series-b, label: Series B}
  - {id: series-c, label: Series C}
  - {id: late, label: Series D and later}
  - {id: public, label: Public}
  - {id: subsidiary, label: Subsidiary or spin-out}
# A company's stage is null until someone has checked it.

workplace:
  - {id: onsite, label: On site}
  - {id: hybrid, label: Hybrid}
  - {id: remote, label: Remote}
  - {id: unknown, label: Not stated}

# Starting set only: the four metros the old hub tracked. Workstream A1
# proposes the full list with the location parser.
metros:
  - {id: sf-bay-area, label: San Francisco Bay Area}
  - {id: san-diego, label: San Diego}
  - {id: denver, label: Denver and Front Range}
  - {id: boston, label: Boston area}

climate_tiers:
  - {id: core, label: Core, listed: true}
  - {id: enabling, label: Enabling, listed: true}
  - {id: out, label: Out, listed: false}
  - {id: unscreened, label: Not yet screened, listed: false}

# How the old hub's tags map onto this taxonomy. Used only by the seed import.
seed_maps:
  # "prod" (product roles) has no discipline: it sets the function to product.
  old_hub_profiles: {sys: systems, elec: electrical, mech: mechanical, test: test}
  old_hub_where: {sf: sf-bay-area, sd: san-diego, denver: denver, boston: boston}
